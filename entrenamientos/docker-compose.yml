
services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: backend-regymstro
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_URL: "jdbc:oracle:thin:@regymstro_high?TNS_ADMIN=/app/wallet"
    volumes:
      - "D:/Wallet_Regymstro:/app/wallet:ro"
    restart: unless-stopped

  frontend:
    build:
      context: ../../../regymstroFrontEnd/regymstro-front-end/regymsdtro-front-end
      dockerfile: dockerfile
    container_name: frontend-regymstro
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

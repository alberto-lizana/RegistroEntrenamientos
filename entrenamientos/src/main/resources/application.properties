
spring.application.name=entrenamientos
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET}

# Base de Datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password= ${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.security=DEBUG
spring.sql.init.mode=always
spring.jpa.show-sql=true

# Control de Errores
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# hikariCP 
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
logging.level.com.zaxxer.hikari=DEBUG

# ADMIN
app.admin.nombre=${ADMIN_NOMBRE}
app.admin.appat=${ADMIN_APPAT}
app.admin.apmat=${ADMIN_APMAT}
app.admin.fecha-nacimiento=${ADMIN_FECHA_NACIMIENTO}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.plan=${ADMIN_PLAN}
app.admin.sexo=${ADMIN_SEXO}